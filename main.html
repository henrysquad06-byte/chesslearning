<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chess Academy</title>

    <!-- Chessboard -->
    <link rel="stylesheet"
        href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
        }

        .page {
            max-width: 800px;
            margin: 25px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
            margin-bottom: 20px;
        }

        button {
            padding: 13px 20px;
            margin: 6px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        #gameScreen {
            display: none;
        }

        #board {
            width: min(90vw, 520px);
            margin: 20px auto;
        }

        #dialogue {
            background: #eeeeee;
            padding: 15px;
            border-radius: 12px;
            margin: 15px auto;
            max-width: 500px;
            font-size: 17px;
        }

        .sideButtons {
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>♟️ Chess Academy</h1>
    <p>Learn chess and play against Oscar</p>
</header>

<div class="page">

    <!-- HOME SCREEN -->

    <div id="homeScreen" class="card">

        <h2>Welcome to Chess Academy! 👋</h2>

        <p>
            Learn chess, practice your skills,
            and eventually challenge Oscar.
        </p>

        <button onclick="openGame()">
            ♟️ Play Against Oscar
        </button>

        <h2>📚 Lessons</h2>

        <p>
            Lessons will be added as Oscar's chess knowledge grows.
        </p>

    </div>


    <!-- GAME SCREEN -->

    <div id="gameScreen" class="card">

        <h2>♟️ Play Against Oscar</h2>

        <div class="sideButtons">

            <button onclick="playWhite()">
                ♙ Play White
            </button>

            <button onclick="playBlack()">
                ♟ Play Black
            </button>

        </div>

        <div id="board"></div>

        <div id="dialogue">
            Oscar: Welcome to the match! Choose your side.
        </div>

        <button onclick="newGame()">
            🔄 New Game
        </button>

        <button onclick="goHome()">
            🏠 Back
        </button>

    </div>

</div>


<!-- Required libraries -->

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>


<script>

    let board;
    let game;
    let playerColor = "w";


    function openGame() {

        document.getElementById("homeScreen").style.display = "none";
        document.getElementById("gameScreen").style.display = "block";

        newGame();
    }


    function newGame() {

        game = new Chess();

        board = Chessboard("board", {
            position: "start",
            draggable: true,
            orientation: playerColor === "w" ? "white" : "black",

            onDrop: function(source, target) {

                const move = game.move({
                    from: source,
                    to: target,
                    promotion: "q"
                });

                if (move === null) {
                    return "snapback";
                }

                board.position(game.fen());

                document.getElementById("dialogue").textContent =
                    "Oscar: Nice move! I'm thinking...";
            }
        });

        document.getElementById("dialogue").textContent =
            playerColor === "w"
            ? "Oscar: You're White. Your move!"
            : "Oscar: You're Black. I'll make the first move.";
    }


    function playWhite() {

        playerColor = "w";

        newGame();

        document.getElementById("dialogue").textContent =
            "Oscar: You're playing White. Your move!";
    }


    function playBlack() {

        playerColor = "b";

        newGame();

        document.getElementById("dialogue").textContent =
            "Oscar: You're playing Black. I'll move first soon.";
    }


    function goHome() {

        document.getElementById("gameScreen").style.display = "none";
        document.getElementById("homeScreen").style.display = "block";
    }

</script>

</body>
</html>
